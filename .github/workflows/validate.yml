name: validate-news
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Resolve latest report date
        id: report
        run: echo "date=$(python scripts/validate_news.py --print-latest-date)" >> "$GITHUB_OUTPUT"
      - name: Validate latest daily bundle
        run: python scripts/validate_news.py --date "${{ steps.report.outputs.date }}"
      - name: Run unit and site-builder tests
        run: python -m pytest -q
      - name: Run Olah static validation for four pillars
        run: |
          for section in politics finance economy livelihood; do
            python .agent/skills/olah-style-paper-posts/scripts/validate.py "sections/${{ steps.report.outputs.date }}/${section}/index.html"
          done
      - name: Run Chromium QA for four pillars
        run: |
          mkdir -p artifacts
          for section in politics finance economy livelihood; do
            python .agent/skills/olah-style-paper-posts/scripts/browser_check.py "sections/${{ steps.report.outputs.date }}/${section}/index.html" --output "artifacts/${{ steps.report.outputs.date }}/${section}"
          done
      - name: Build curated Pages artifact
        run: python scripts/build_site.py --output dist
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xm-news-browser-qa
          path: artifacts/
          if-no-files-found: ignore
