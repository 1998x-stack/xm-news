name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Resolve latest report date
        id: report
        run: echo "date=$(python scripts/validate_news.py --print-latest-date)" >> "$GITHUB_OUTPUT"
      - name: Validate daily report bundle
        run: python scripts/validate_news.py --date "${{ steps.report.outputs.date }}"
      - name: Run regression tests
        run: python -m pytest -q
      - name: Validate Olah HTML structure for four pillars
        run: |
          for section in politics finance economy livelihood; do
            python .agent/skills/olah-style-paper-posts/scripts/validate.py "sections/${{ steps.report.outputs.date }}/${section}/index.html"
          done
      - name: Run browser QA for four pillars
        run: |
          mkdir -p artifacts
          for section in politics finance economy livelihood; do
            python .agent/skills/olah-style-paper-posts/scripts/browser_check.py "sections/${{ steps.report.outputs.date }}/${section}/index.html" --output "artifacts/${{ steps.report.outputs.date }}/${section}"
          done
      - name: Build curated site
        run: python scripts/build_site.py --output dist
      - name: Verify date-first homepage, filtering, day hub and four detail routes
        run: python scripts/browser_site_check.py --site dist --output artifacts/site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xm-news-pages-qa
          path: artifacts/
          if-no-files-found: ignore
